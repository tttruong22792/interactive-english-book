name: Deploy Language Studio to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify this run is still current main HEAD
        id: head_guard
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "Current main: $CURRENT_HEAD"
          echo "This run:     $GITHUB_SHA"
          if [ "$CURRENT_HEAD" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale Pages deployment."
          fi

      - name: Setup Node
        if: steps.head_guard.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        if: steps.head_guard.outputs.deploy == 'true'
        run: |
          node --check app.js
          node --check reading-studio.js
          node --check data/english/reading-stories-a1.js
          node --check data/english/reading-stories-a2.js
          node --check data/english/reading-stories-b1-b2.js
          node --check scripts/test-reading-studio.mjs
          node --check vocabulary-trainer.js
          node --check chunk-listener.js
          node --check scripts/test-chunk-listener.mjs
          node --check scripts/test-chunk-usage-examples.mjs
          node --check scripts/test-active-path.mjs
          node --check english-challenge.js
          node --check scripts/test-english-challenge.mjs
          node --check scripts/test-chunk-memory.mjs
          node --check data/english/patterns/specs-13-80.js
          node --check data/english/patterns/curriculum-13-80.js
          node --check scripts/test-patterns-13-80.mjs
          node --check data/english/patterns/supplements-13-80.js
          node --check data/english/unique-chunk-bank.js
          node --check data/english/unique-study-chunks.js
          node --check scripts/test-unique-chunk-curriculum.mjs
          node --check scripts/test-pattern-supplements-13-80.mjs
          node --check data/english/active-study-packs.js
          node --check data/english/chunk-usage-vi.js
          node --check cloud-sync.js
          node --check daily-learning-v52.js
          node --check scripts/test-daily-v52.mjs
          node --check scripts/test-app-shell-v53.mjs
          node --check scripts/test-easy-play-theme-v58.mjs

      - name: Test listening lesson switching
        if: steps.head_guard.outputs.deploy == 'true'
        run: node scripts/test-chunk-listener.mjs

      - name: Test five-use chunk examples
        if: steps.head_guard.outputs.deploy == 'true'
        run: node scripts/test-chunk-usage-examples.mjs

      - name: Test Active Path progression
        if: steps.head_guard.outputs.deploy == 'true'
        run: node scripts/test-active-path.mjs

      - name: Test full English Challenge coverage
        if: steps.head_guard.outputs.deploy == 'true'
        run: node scripts/test-english-challenge.mjs

      - name: Test all-chunk memory recall
        if: steps.head_guard.outputs.deploy == 'true'
        run: node scripts/test-chunk-memory.mjs

      - name: Test v52 daily learning and legacy progress
        if: steps.head_guard.outputs.deploy == 'true'
        run: node scripts/test-daily-v52.mjs

      - name: Test v53 app shell and navigation
        if: steps.head_guard.outputs.deploy == 'true'
        run: node scripts/test-app-shell-v53.mjs

      - name: Verify Easy Play v58 responsive design and app navigation
        if: steps.head_guard.outputs.deploy == 'true'
        run: node scripts/test-easy-play-theme-v58.mjs

      - name: Test English patterns 13–80
        if: steps.head_guard.outputs.deploy == 'true'
        run: node scripts/test-patterns-13-80.mjs

      - name: Test enriched supplementary chunks for Patterns 13–80
        if: steps.head_guard.outputs.deploy == 'true'
        run: node scripts/test-pattern-supplements-13-80.mjs

      - name: Validate zero duplicate chunks across all 80 lessons
        if: steps.head_guard.outputs.deploy == 'true'
        run: node scripts/test-unique-chunk-curriculum.mjs

      - name: Validate 30 Reading & Listening lessons
        if: steps.head_guard.outputs.deploy == 'true'
        run: node scripts/test-reading-studio.mjs

      - name: Build static site
        if: steps.head_guard.outputs.deploy == 'true'
        run: npm run build

      - name: Configure Pages
        if: steps.head_guard.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: steps.head_guard.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.head_guard.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
