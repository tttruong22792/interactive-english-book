name: Validate book reader PR
on:
  pull_request:
    branches: [main]
    paths:
      - 'book-2100*'
      - 'pattern-80*'
      - 'supabase/migrations/*pattern80*'
      - 'index.html'
      - 'sw.js'
      - 'scripts/build-static.mjs'
      - 'scripts/test-book-2100.mjs'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and Enter behavior
        run: |
          node --check book-2100-data.js
          node --check book-2100-srs.js
          node --check book-2100-cloud.js
          node --check book-2100-deep-001-100.js
          node --check book-2100-deep-101-200.js
          node --check book-2100-deep-201-300.js
          node --check book-2100-deep-301-400.js
          node --check book-2100-grammar.js
          node --check reading-background-audio.js
          node --check book-2100-background.js
          node --check book-2100-listening.js
          node --check pattern-80-round1-data.js
          node --check pattern-80-listening.js
          node --check pattern-80-hints.js
          node --check pattern-80-cloud.js
          node --check pattern-80-study.js
          node --check book-2100.js
          node --check scripts/test-book-2100-srs.mjs
          node --check scripts/test-book-2100.mjs
          node scripts/test-book-2100.mjs
          node scripts/test-book-2100-srs.mjs
          node scripts/test-book-2100-mobile.mjs
          node scripts/test-book-2100-cloud.mjs
          node scripts/test-book-2100-answer.mjs
          node scripts/test-book-2100-grammar.mjs
          node scripts/test-book-2100-background.mjs
          node scripts/test-book-2100-listening.mjs
          node scripts/test-pattern-80-listening.mjs
          node scripts/test-pattern-80-study.mjs
      - name: Build production artifact
        run: npm run build
      - name: Verify all 33 native STEP listening recordings in TTS allow-list
        run: |
          node scripts/test-book-2100-background.mjs --manifest
          node scripts/test-pattern-80-listening.mjs --manifest
          node scripts/test-pattern-80-study.mjs --manifest
      - name: Check shipped assets
        run: |
          test -s dist/book-2100-data.js
          test -s dist/book-2100-srs.js
          test -s dist/book-2100-cloud.js
          test -s dist/book-2100-deep-001-100.js
          test -s dist/book-2100-deep-101-200.js
          test -s dist/book-2100-deep-201-300.js
          test -s dist/book-2100-deep-301-400.js
          test -s dist/book-2100-grammar.js
          test -s dist/reading-background-audio.js
          test -s dist/book-2100-background.js
          test -s dist/book-2100-listening.js
          test -s dist/book-2100-listening.css
          test -s dist/pattern-80-round1-data.js
          test -s dist/pattern-80-listening.js
          test -s dist/pattern-80-listening.css
          test -s dist/pattern-80-hints.js
          test -s dist/pattern-80-cloud.js
          test -s dist/pattern-80-study.js
          test -s dist/pattern-80-study.css
          test -s dist/book-2100.js
          test -s dist/book-2100.css
          test -s dist/book-2100-mobile.css
          grep -q 'book-2100.js' dist/index.html
          grep -q 'book-2100-step-' dist/tts-manifest.json
