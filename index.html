<body>
  <div id="app" class="app-shell">

      <nav class="nav-list" aria-label="Điều hướng chính">

        <button class="nav-item" data-route="tenses"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><b>Các thì tiếng Anh</b></button>
        <button class="nav-item" data-route="shadowing"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14a8 8 0 0 1 16 0"/><path d="M18 19v-5a2 2 0 0 1 2-2h1v7a2 2 0 0 1-2 2h-1Z"/><path d="M6 19v-5a2 2 0 0 0-2-2H3v7a2 2 0 0 0 2 2h1Z"/></svg></span><b>Shadowing</b></button>
        <button class="nav-item" data-route="japanese"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg></span><b>Japanese</b></button>
        <button class="nav-item" data-route="vocab"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3a2 2 0 0 0-2 2v16l8-5 8 5V5a2 2 0 0 0-2-2Z"/></svg></span><b>Từ đã lưu</b><em id="savedCountBadge">0</em></button>
        <button class="nav-item" data-route="practice"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span><b>Luyện tập</b></button>
        <button class="nav-item" data-route="progress"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 16 4-5 4 3 5-7"/></svg></span><b>Tiến độ</b></button>
        <button class="nav-item" data-route="settings"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1L7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg></span><b>Thiết bị & dữ liệu</b></button>

      <div class="side-bottom">
        <button id="resetDataBtn" class="text-button">↻ Xóa dữ liệu học</button>
        <small>Dữ liệu hiện được lưu trên thiết bị này.</small>
      </div>
    </aside>

    <div class="content-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuBtn" class="icon-button mobile-only" aria-label="Mở menu"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div>
            <div id="crumb" class="crumb">Trang chủ</div>
            <div id="pageTitle" class="page-title-small">Language Studio</div>
          </div>
        </div>
        <div id="lessonControls" class="lesson-controls hidden">
<button id="hideViBtn" class="pill-button">Ẩn tiếng Việt</button>
          <label class="speed-pill">Tốc độ
            <select id="globalRateSelect" aria-label="Tốc độ đọc">
              <option value="0.68">Chậm</option>
              <option value="0.88">Vừa</option>
              <option value="1">Tự nhiên</option>
            </select>
          </label>
        </div>
      </header>

      <main id="mainView" class="main-view" tabindex="-1"></main>

      <nav class="bottom-nav mobile-only" aria-label="Điều hướng di động">
        <button data-route="home"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg></span><small>Home</small></button>
        <button data-route="patterns"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2h5a3 3 0 0 1 3 3v15a3 3 0 0 0-3-3Z"/><path d="M21 18a1 1 0 0 0 1-1V5a2 2 0 0 0-2-2h-5a3 3 0 0 0-3 3v15a3 3 0 0 1 3-3Z"/></svg></span><small>English</small></button>
        <button data-route="japanese"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg></span><small>日本語</small></button>
        <button data-route="vocab"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3a2 2 0 0 0-2 2v16l8-5 8 5V5a2 2 0 0 0-2-2Z"/></svg></span><small>Từ</small></button>
        <button data-route="practice"><span><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span><small>Luyện</small></button>
      </nav>
    </div>
  </div>

  <div id="drawerShade" class="drawer-shade hidden"></div>

  <div id="wordPopover" class="popover hidden" role="dialog" aria-live="polite">
    <div class="popover-head">
      <div><strong id="popoverWord">word</strong><span id="popoverIpa"></span></div>
      <button id="closePopoverBtn" class="icon-button" aria-label="Đóng">×</button>
    </div>
    <div id="popoverMeaning" class="popover-meaning"></div>
    <div id="popoverBreakdown" class="popover-breakdown hidden"></div>
    <div id="popoverExample" class="popover-example"></div>
    <div class="popover-actions">
      <button id="speakWordBtn" class="primary-button"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span>Nghe</span></button>
      <button id="saveWordBtn" class="secondary-button"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.3L5.8 21 7 14.2 2 9.3l6.9-1Z"/></svg><span>Lưu</span></button>
    </div>
  </div>

  <div id="selectionBar" class="selection-bar hidden">
    <div><small>Cụm đã chọn</small><strong id="selectionText"></strong></div>
    <div>
      <button id="selectionSpeakBtn" aria-label="Nghe cụm từ"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
      <button id="selectionLookupBtn">Tra nghĩa</button>
      <button id="selectionCloseBtn">×</button>
    </div>
  </div>

  <div id="toast" class="toast hidden" aria-live="polite"></div>

  <script>
    window.__LS_BOOT_ERRORS = [];
    window.addEventListener('error', function (event) {
      window.__LS_BOOT_ERRORS.push(event.message || 'Unknown startup error');
    });
    window.setTimeout(function () {
      if (window.__LS_RENDERED) return;
      var main = document.getElementById('mainView');
      if (!main) return;
      var details = window.__LS_BOOT_ERRORS.length
        ? window.__LS_BOOT_ERRORS.join(' | ')
        : (window.__LS_RUNTIME_STARTED
            ? 'runtime.js đã bắt đầu nhưng app chưa render.'
            : 'runtime.js chưa được tải hoặc chưa chạy.');
      main.innerHTML =
        '<section class="page-hero"><div class="eyebrow">STARTUP DIAGNOSTIC</div>' +
        '<h1>Language Studio chưa khởi động được</h1>' +
        '<p>' + details.replace(/[&<>]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];}) + '</p>' +
        '<p style="margin-top:12px">Mở /api/asset-check nếu cần kiểm tra file.</p></section>';
    }, 3500);
  </script>
  <script>
    (function () {
      var src = location.protocol === 'https:'
        ? 'runtime-20260926-dashboard-v2.js'
        : 'runtime.js?v=20260926-dashboard-v2-local';
      var script = document.createElement('script');
      script.src = src;
      script.async = false;
      document.body.appendChild(script);
    }());
  </script>
</body>
</html>
