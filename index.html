<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8f7cf7" />
  <meta name="description" content="Language Studio – nền tảng tự học English + Japanese, từ vựng, nghe, nói và mẫu câu tương tác." />
  <title>Language Studio – English + Japanese</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=20260925-shadowing-v1" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <button class="brand" data-route="home" aria-label="Trang chủ">
        <span class="brand-mark">LS</span>
        <span class="brand-copy"><strong>Language Studio</strong><small>Learn for real life</small></span>
      </button>

      <div class="side-progress">
        <div class="side-progress-top"><span id="sidebarProgressLabel">English · Pattern 01</span><strong id="sidebarProgressText">0%</strong></div>
        <div class="progress-track"><div id="sidebarProgressBar" class="progress-fill"></div></div>
        <small id="sidebarProgressNote">Bắt đầu học I’d like to…</small>
      </div>

      <nav class="nav-list" aria-label="Điều hướng chính">
        <button class="nav-item" data-route="home"><span>⌂</span><b>Trang chủ</b></button>
        <button class="nav-item" data-route="patterns"><span>EN</span><b>English</b></button>
        <button class="nav-item" data-route="tenses"><span>⌛</span><b>Các thì tiếng Anh</b></button>
        <button class="nav-item" data-route="shadowing"><span>🎧</span><b>Shadowing</b></button>
        <button class="nav-item" data-route="japanese"><span>日</span><b>Japanese</b></button>
        <button class="nav-item" data-route="vocab"><span>★</span><b>Từ đã lưu</b><em id="savedCountBadge">0</em></button>
        <button class="nav-item" data-route="practice"><span>▶</span><b>Luyện tập</b></button>
        <button class="nav-item" data-route="progress"><span>◔</span><b>Tiến độ</b></button>
        <button class="nav-item" data-route="settings"><span>⚙</span><b>Thiết bị & dữ liệu</b></button>
      </nav>

      <div class="side-bottom">
        <button id="resetDataBtn" class="text-button">↻ Xóa dữ liệu học</button>
        <small>Dữ liệu hiện được lưu trên thiết bị này.</small>
      </div>
    </aside>

    <div class="content-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuBtn" class="icon-button mobile-only" aria-label="Mở menu">☰</button>
          <div>
            <div id="crumb" class="crumb">Trang chủ</div>
            <div id="pageTitle" class="page-title-small">Language Studio</div>
          </div>
        </div>
        <div id="lessonControls" class="lesson-controls hidden">
<button id="hideViBtn" class="pill-button">Ẩn tiếng Việt</button>
          <label class="speed-pill">Tốc độ
            <select id="globalRateSelect" aria-label="Tốc độ đọc">
              <option value="0.68">Chậm</option>
              <option value="0.88">Vừa</option>
              <option value="1">Tự nhiên</option>
            </select>
          </label>
        </div>
      </header>

      <main id="mainView" class="main-view" tabindex="-1"></main>

      <nav class="bottom-nav mobile-only" aria-label="Điều hướng di động">
        <button data-route="home"><span>⌂</span><small>Home</small></button>
        <button data-route="patterns"><span>EN</span><small>English</small></button>
        <button data-route="japanese"><span>日</span><small>日本語</small></button>
        <button data-route="vocab"><span>★</span><small>Từ</small></button>
        <button data-route="practice"><span>▶</span><small>Luyện</small></button>
      </nav>
    </div>
  </div>

  <div id="drawerShade" class="drawer-shade hidden"></div>

  <div id="wordPopover" class="popover hidden" role="dialog" aria-live="polite">
    <div class="popover-head">
      <div><strong id="popoverWord">word</strong><span id="popoverIpa"></span></div>
      <button id="closePopoverBtn" class="icon-button" aria-label="Đóng">×</button>
    </div>
    <div id="popoverMeaning" class="popover-meaning"></div>
    <div id="popoverBreakdown" class="popover-breakdown hidden"></div>
    <div id="popoverExample" class="popover-example"></div>
    <div class="popover-actions">
      <button id="speakWordBtn" class="primary-button">🔊 Nghe</button>
      <button id="saveWordBtn" class="secondary-button">☆ Lưu</button>
    </div>
  </div>

  <div id="selectionBar" class="selection-bar hidden">
    <div><small>Cụm đã chọn</small><strong id="selectionText"></strong></div>
    <div>
      <button id="selectionSpeakBtn">🔊</button>
      <button id="selectionLookupBtn">Tra nghĩa</button>
      <button id="selectionCloseBtn">×</button>
    </div>
  </div>

  <div id="toast" class="toast hidden" aria-live="polite"></div>

  <script>
    window.__LS_BOOT_ERRORS = [];
    window.addEventListener('error', function (event) {
      window.__LS_BOOT_ERRORS.push(event.message || 'Unknown startup error');
    });
    window.setTimeout(function () {
      if (window.__LS_RENDERED) return;
      var main = document.getElementById('mainView');
      if (!main) return;
      var details = window.__LS_BOOT_ERRORS.length
        ? window.__LS_BOOT_ERRORS.join(' | ')
        : (window.__LS_RUNTIME_STARTED
            ? 'runtime.js đã bắt đầu nhưng app chưa render.'
            : 'runtime.js chưa được tải hoặc chưa chạy.');
      main.innerHTML =
        '<section class="page-hero"><div class="eyebrow">STARTUP DIAGNOSTIC</div>' +
        '<h1>Language Studio chưa khởi động được</h1>' +
        '<p>' + details.replace(/[&<>]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];}) + '</p>' +
        '<p style="margin-top:12px">Mở /api/asset-check nếu cần kiểm tra file.</p></section>';
    }, 3500);
  </script>
  <script>
    (function () {
      var src = location.protocol === 'https:'
        ? 'runtime-20260925-shadowing-v1.js'
        : 'runtime.js?v=20260925-shadowing-v1-local';
      var script = document.createElement('script');
      script.src = src;
      script.async = false;
      document.body.appendChild(script);
    }());
  </script>
</body>
</html>
